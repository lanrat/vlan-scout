name: macOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build macOS binaries
        run: ./scripts/build-darwin.sh

      - uses: actions/upload-artifact@v4
        with:
          name: vlan-scout-darwin
          path: dist/*.tar.gz
