name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Create snapshot release (no publish)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  darwin:
    name: darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build macOS binaries
        run: ./scripts/build-darwin.sh

      - uses: actions/upload-artifact@v7
        with:
          name: vlan-scout-darwin
          path: dist/*.tar.gz

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: go.sum

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Cache libpcap builds
        uses: actions/cache@v6
        with:
          path: .libs
          key: libpcap-${{ hashFiles('scripts/setup-build-deps.sh') }}-v1
          restore-keys: |
            libpcap-

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y flex bison

      - name: Setup build dependencies
        run: ./scripts/setup-build-deps.sh

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean ${{ github.event.inputs.snapshot == 'true' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBS_DIR: ${{ github.workspace }}/.libs
          NPCAP_DIR: ${{ github.workspace }}/.libs/npcap-sdk

  attach-darwin:
    name: attach darwin binaries
    needs: [darwin, release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vlan-scout-darwin
          path: dist

      - name: Attach binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release upload "$tag" dist/*.tar.gz --clobber

          dir=$(mktemp -d)
          gh release download "$tag" --pattern checksums.txt --dir "$dir"
          grep -v 'vlan-scout_darwin_' "$dir/checksums.txt" > "$dir/checksums.new"
          (
            cd dist
            sha256sum vlan-scout_darwin_*.tar.gz
          ) >> "$dir/checksums.new"
          mv "$dir/checksums.new" "$dir/checksums.txt"
          gh release upload "$tag" "$dir/checksums.txt" --clobber

